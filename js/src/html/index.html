<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>af1</title>
    <meta name="description" content="Mobile GitHub command center" />
    <meta name="author" content="the af1 authors" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="stylesheet" type="text/css" href="css/index.css" />
    <script type="module" src="cdn/index.js"></script>
  </head>
  <body>
    <header id="app-header">
      <div class="header-left">
        <h1>af1</h1>
        <nav id="app-nav">
          <a href="#/" class="nav-link active" data-view="pr-list"
            >Pull Requests</a
          >
          <a href="#/issues" class="nav-link" data-view="issue-list">Issues</a>
          <a href="#/repos" class="nav-link" data-view="repo-list">Repos</a>
        </nav>
      </div>
      <div class="header-right">
        <button id="sync-btn" title="Sync now">
          <span class="sync-icon">&#x21bb;</span>
        </button>
        <span id="user-info"></span>
      </div>
    </header>
    <main id="app-main">
      <div id="loading" class="loading">Loading&hellip;</div>
      <div id="view-container"></div>
    </main>
  </body>
</html>
